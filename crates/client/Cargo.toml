[package]
name = "rusteze-client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rusteze-client"
path = "src/main.rs"

[dependencies]
rusteze-models = { path = "../models" }

# GPUI
gpui = "0.2"
gpui-component = "0.5"
gpui-component-assets = "0.5"

# Async / channels
async-channel = "2"

# Networking
tungstenite = "0.26"
ureq = { version = "3", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# IDs
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Audio
cpal = "0.17"

# Encoding
base64 = "0.22"

# Misc
url = "2"
anyhow = "1"
